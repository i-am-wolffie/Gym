<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0f1e">
<title>Gym Plan</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="icons/favicon.ico">
<meta name="mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;background:#0a0f1e;color:#e8eaf0;min-height:100vh;overflow-x:hidden}

/* ── DAY TABS ── */
.tabs{display:flex;background:#111827;border-bottom:1px solid #1f2a3d;position:sticky;top:0;z-index:50}
.tab{flex:1;padding:11px 2px 8px;text-align:center;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s}
.tab-label{font-size:11px;font-weight:700;letter-spacing:.5px;color:#4b5680;display:block}
.tab-sub{font-size:9px;color:#2d3a55;display:block;margin-top:1px;line-height:1}
.tab.active .tab-label{color:#60a5fa}
.tab.active{border-bottom-color:#60a5fa}
.tab.active .tab-sub{color:#3b82f6}
.swim-pip{display:inline-block;width:5px;height:5px;background:#38bdf8;border-radius:50%;margin-left:3px;vertical-align:middle}

/* ── DAY HEADER ── */
.day-head{padding:16px 16px 0}
.day-title{font-size:24px;font-weight:800;letter-spacing:-.5px;color:#f1f5f9}
.day-sub{font-size:13px;color:#64748b;margin-top:3px;font-weight:500}
.tag-pill{display:inline-flex;align-items:center;margin:10px 16px 0;background:#1e3a5f;color:#93c5fd;font-size:11px;font-weight:700;letter-spacing:.3px;padding:5px 10px;border-radius:20px}
.swim-pill{display:flex;align-items:center;gap:6px;margin:6px 16px 0;background:#0c2d3f;color:#38bdf8;font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;width:fit-content}
.timing{margin:10px 16px 0;font-size:11px;color:#4b5680;font-style:italic;line-height:1.5}

/* ── CLUSTERS ── */
.clusters{padding:12px 12px 0}
.cluster{border-radius:12px;overflow:hidden;margin-bottom:14px}
.c-head{padding:11px 14px}
.c-name{font-size:14px;font-weight:800;color:#fff;letter-spacing:.2px}
.c-note{font-size:11px;color:rgba(255,255,255,.6);margin-top:2px}
.c-cols{display:grid;grid-template-columns:30px 1fr 78px 22px;gap:6px;padding:5px 12px;background:#111827;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#2d3a55}

/* ── EXERCISE ROWS ── */
.ex{display:grid;grid-template-columns:30px 1fr 78px 22px;gap:6px;padding:12px 12px;background:#111827;border-top:1px solid #0a0f1e;cursor:pointer;align-items:center;transition:background .15s}
.ex:active,.ex.open{background:#162035}
.ex-label{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:#fff;flex-shrink:0}
.ex-name{font-size:14px;font-weight:600;color:#e2e8f0;line-height:1.3}
.ex-sets{font-size:11px;color:#64748b;font-weight:500}
.chevron{color:#2d3a55;font-size:16px;text-align:center;transition:transform .2s;line-height:1}
.ex.open .chevron{color:#60a5fa;transform:rotate(90deg)}

/* ── EXERCISE DETAIL ── */
.ex-detail{background:#0e1624;border-top:1px solid #0a0f1e;overflow:hidden;max-height:0;transition:max-height .3s ease}
.ex-detail.open{max-height:500px}
.ex-detail-inner{padding:14px 14px 12px}
.coaching{font-size:13px;color:#94a3b8;line-height:1.65;margin-bottom:14px}

/* Weight inputs */
.weight-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.w-field label{display:block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#3b4d6a;margin-bottom:4px}
.w-field input{width:100%;background:#111827;border:1px solid #1f2a3d;border-radius:8px;padding:9px 10px;color:#e2e8f0;font-size:15px;-webkit-appearance:none;transition:border-color .2s}
.w-field input:focus{outline:none;border-color:#3b82f6;background:#162035}
.w-field input::placeholder{color:#2d3a55}

/* Action buttons */
.ex-btns{display:flex;gap:8px}
.btn-guide{flex:1;background:#1e3a5f;color:#93c5fd;border:none;border-radius:9px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.2px}
.btn-guide:active{background:#2a4f7a}
.btn-timer{background:#0f2a1a;color:#4ade80;border:none;border-radius:9px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap}
.btn-timer:active{background:#1a3d28}

/* ── GUIDE OVERLAY ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:flex-end}
.overlay.show{display:flex}
.drawer{background:#111827;border-radius:20px 20px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:20px 16px 48px;position:relative}
.drawer-handle{width:36px;height:4px;background:#1f2a3d;border-radius:2px;margin:0 auto 16px}
.drawer-title{font-size:18px;font-weight:800;color:#f1f5f9;margin-bottom:18px;letter-spacing:-.3px}
.g-section{margin-bottom:14px}
.g-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#3b4d6a;margin-bottom:5px}
.g-text{font-size:14px;color:#94a3b8;line-height:1.65}
.g-step{font-size:14px;color:#94a3b8;line-height:1.55;margin-bottom:5px;padding-left:20px;position:relative}
.g-step::before{content:attr(data-n)'.';position:absolute;left:0;color:#3b82f6;font-weight:700}
.g-key{background:#0c2540;border-left:3px solid #3b82f6;padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px;color:#93c5fd;font-style:italic;line-height:1.55}
.g-warn{background:#1f1200;border-left:3px solid #f59e0b;padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px;color:#fde68a;line-height:1.55}
.btn-close{position:absolute;top:16px;right:16px;width:32px;height:32px;background:#1f2a3d;border:none;border-radius:50%;color:#64748b;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}

/* ── TIMER ── */
.timer-ov{position:fixed;inset:0;background:rgba(5,10,25,.93);z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center}
.timer-ov.show{display:flex}
.timer-num{font-size:88px;font-weight:900;letter-spacing:-4px;font-variant-numeric:tabular-nums;line-height:1}
.timer-lbl{font-size:15px;color:#4b5680;margin-top:6px;margin-bottom:40px;letter-spacing:.5px}
.timer-btns{display:flex;gap:12px}
.btn-t{border:none;border-radius:12px;padding:13px 24px;font-size:15px;font-weight:700;cursor:pointer}
.btn-t-skip{background:#1f2a3d;color:#64748b}
.btn-t-60{background:#162035;color:#60a5fa}
.btn-t-90{background:#162035;color:#60a5fa}
.timer-preset{display:flex;gap:10px;margin-bottom:20px}
.timer-p{background:#111827;border:1px solid #1f2a3d;border-radius:10px;padding:9px 18px;font-size:13px;font-weight:700;color:#4b5680;cursor:pointer}
.timer-p.sel{background:#1e3a5f;color:#93c5fd;border-color:#3b82f6}

/* ── PULL UP PROGRESS ── */
.progress-bar-wrap{margin:0 12px 14px;background:#111827;border-radius:12px;overflow:hidden;border:1px solid #1f2a3d}
.progress-head{padding:10px 14px;background:#1a2035;display:flex;justify-content:space-between;align-items:center}
.progress-title{font-size:12px;font-weight:700;color:#93c5fd;letter-spacing:.3px}
.progress-sub{font-size:10px;color:#3b4d6a}
.progress-row{display:grid;grid-template-columns:1fr 70px 80px;gap:6px;padding:8px 14px;border-top:1px solid #0a0f1e;align-items:center}
.p-name{font-size:12px;color:#94a3b8;font-weight:500}
.p-where{font-size:10px;color:#3b4d6a}
.p-status{font-size:10px;font-weight:700;text-align:right}
.status-current{color:#60a5fa}
.status-next{color:#f59e0b}
.status-goal{color:#4ade80}

.bottom-pad{height:30px}

/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#1f2a3d;border-radius:2px}
</style>
</head>
<body>

<div class="tabs" id="tabs"></div>
<div id="main"></div>

<div class="overlay" id="guideOverlay">
  <div class="drawer" id="guideDrawer">
    <div class="drawer-handle"></div>
    <button class="btn-close" onclick="closeGuide()">×</button>
    <div id="guideContent"></div>
  </div>
</div>

<div class="timer-ov" id="timerOv">
  <div class="timer-num" id="timerNum">90</div>
  <div class="timer-lbl">REST</div>
  <div class="timer-preset">
    <div class="timer-p" onclick="setPreset(60)">60s</div>
    <div class="timer-p sel" onclick="setPreset(90)">90s</div>
  </div>
  <div class="timer-btns">
    <button class="btn-t btn-t-skip" onclick="closeTimer()">Skip</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════
// PLAN DATA
// ═══════════════════════════════════════════════
const COLORS = ['#1B4F72','#1A5E3A','#7D6608','#5B21B6'];

const PLAN = [
{
  title:'Day 1 — Push', sub:'Chest · Shoulders · Triceps',
  tag:'Strength + Eccentric Control', swim:true,
  timing:'Warm-up 5min · C1 ~9min · Setup 1–2min · C2 ~9min · Setup 1min · C3 ~9min · Setup 1min · C4 ~7min · Total ~45min',
  clusters:[
    { name:'Cluster 1 — Chest Strength', note:'BB loaded for bench. DBs light for lateral raises.',
      exercises:[

          guide:{ setup:'Stand upright, DBs at sides, palms inward. Slight elbow bend throughout.',
            steps:['Raise arms directly sideways — T-shape.','Lead with elbows. Thumbs slightly lower than pinkies at top.','Raise to shoulder height only — no higher.','Lower with control 2–3 seconds.'],

      ]},
    { name:'Cluster 2 — Upper Chest & Shoulders', note:'Bench to 30–35°. DBs set for shoulder press. Mace for the finisher.',

            steps:['Lower DBs in wide arc, leading with elbows.','Stop when elbows level with bench — no lower.','Squeeze chest and bring DBs back in same arc.','This is a FLY not a press — elbows stay bent.'],

{

];

const PULLUP_PROGRESS = [
  {name:'Dead Hang', sets:'3 × 30–45s', on:'Day 2', status:'current', note:'Grip and shoulder stability. Build time each week.'},
  {name:'Scapular Pull-Ups', sets:'3 × 10', on:'Days 2 & 4', status:'current', note:'Lat initiation without arm bend.'},
  {name:'Assisted Pull-Up / Chin-Up (bar method)', sets:'3 × max', on:'Days 2 & 5', status:'current', note:'Leg-assisted on the squat rack bar. Raise the bar weekly as strength improves.'},
  {name:'Negative Pull-Ups', sets:'3 × 3–5', on:'Replaces assisted bar work', status:'next', note:'Jump to top, 4–5 sec lower. Add once assisted reps feel fully controlled with minimal leg support.'},
  {name:'Full Pull-Up', sets:'3 × max', on:'The goal', status:'goal', note:'Dead hang to chin over bar. Unassisted.'},
];

// ═══════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════
let currentDay = 0;
let openEx = null; // "d_c_e" string
let timerInterval = null;
let timerSeconds = 0;
let timerPreset = 90;

// ═══════════════════════════════════════════════
// WEIGHT STORAGE
// ═══════════════════════════════════════════════
function wKey(d,c,e,wk){ return `w_${d}_${c}_${e}_${wk}`; }
function getW(d,c,e,wk){ try{ return localStorage.getItem(wKey(d,c,e,wk))||''; }catch(e){ return ''; } }
function setW(d,c,e,wk,v){ try{ localStorage.setItem(wKey(d,c,e,wk),v); }catch(e){} }

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════
function render(){
  renderTabs();
  renderMain();
}

function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = PLAN.map((day,i)=>`
    <div class="tab ${i===currentDay?'active':''}" onclick="selectDay(${i})">
      <span class="tab-label">D${i+1}${day.swim?'<span class=\'swim-pip\'></span>':''}</span>
      <span class="tab-sub">${day.sub.split('·')[0].trim().split(' ')[0]}</span>
    </div>`).join('');
}

function renderMain(){
  const day = PLAN[currentDay];
  let html = `
    <div class="day-head">
      <div class="day-title">${day.title}</div>
      <div class="day-sub">${day.sub}</div>
    </div>
    <div class="tag-pill">${day.tag}</div>
    ${day.swim?'<div class="swim-pill"><span>🏊</span> Swim day — active shoulder recovery after this session</div>':''}
    <div class="timing">${day.timing}</div>
    <div class="clusters">`;

  day.clusters.forEach((cl,ci)=>{
    html += `
      <div class="cluster">
        <div class="c-head" style="background:${COLORS[ci]}">
          <div class="c-name">${cl.name}</div>
          <div class="c-note">${cl.note}</div>
        </div>
        <div class="c-cols"><span></span><span>Exercise</span><span>Sets</span><span></span></div>`;

    cl.exercises.forEach((ex,ei)=>{
      const key = `${currentDay}_${ci}_${ei}`;
      const isOpen = openEx === key;
      html += `
        <div class="ex ${isOpen?'open':''}" onclick="toggleEx('${key}')">
          <div class="ex-label" style="background:${COLORS[ci]}">${ex.l}</div>
          <div class="ex-name">${ex.name}</div>
          <div class="ex-sets">${ex.sets}</div>
          <div class="chevron">›</div>
        </div>
        <div class="ex-detail ${isOpen?'open':''}">
          <div class="ex-detail-inner">
            <div class="coaching">${ex.coaching}</div>
            <div class="weight-row">
              ${[1,2,3,4].map(wk=>`
                <div class="w-field">
                  <label>Week ${wk}</label>
                  <input type="text" inputmode="text" placeholder="e.g. 60kg"
                    value="${getW(currentDay,ci,ei,wk)}"
                    onchange="setW(${currentDay},${ci},${ei},${wk},this.value)"
                    onclick="event.stopPropagation()">
                </div>`).join('')}
            </div>
            <div class="ex-btns">
              <button class="btn-guide" onclick="event.stopPropagation();openGuide(${currentDay},${ci},${ei})">📖 Exercise Guide</button>
              <button class="btn-timer" onclick="event.stopPropagation();startTimer()">⏱ Rest</button>
            </div>
          </div>
        </div>`;
    });
    html += `</div>`;
  });

  // Pull-up progress on Day 2
  if(currentDay === 1){
    html += renderPullProgress();
  }

  html += `</div><div class="bottom-pad"></div>`;
  document.getElementById('main').innerHTML = html;
}

function renderPullProgress(){
  return `
    <div class="progress-bar-wrap">
      <div class="progress-head">
        <span class="progress-title">PULL-UP PROGRESSION</span>
        <span class="progress-sub">Your path to full pull-ups</span>
      </div>
      ${PULLUP_PROGRESS.map(p=>`
        <div class="progress-row">
          <div>
            <div class="p-name">${p.name}</div>
            <div style="font-size:11px;color:#3b4d6a;margin-top:2px">${p.note}</div>
          </div>
          <div class="p-where">${p.sets}</div>
          <div class="p-status status-${p.status}">${
            p.status==='current'?'● Current':
            p.status==='next'?'◉ Next step':
            '★ Goal'
          }</div>
        </div>`).join('')}
    </div>`;
}

// ═══════════════════════════════════════════════
// INTERACTIONS
// ═══════════════════════════════════════════════
function selectDay(i){
  currentDay = i;
  openEx = null;
  render();
  window.scrollTo(0,0);
}

function toggleEx(key){
  openEx = openEx === key ? null : key;
  renderMain();
  if(openEx){
    setTimeout(()=>{
      const [d,c,e] = key.split('_').map(Number);
      const els = document.querySelectorAll('.ex');
      let count = 0;
      for(let ci=0;ci<c;ci++) count += PLAN[currentDay].clusters[ci].exercises.length;
      count += e;
      if(els[count]) els[count].scrollIntoView({behavior:'smooth',block:'start'});
    },50);
  }
}

// ═══════════════════════════════════════════════
// GUIDE
// ═══════════════════════════════════════════════
function openGuide(d,c,e){
  const ex = PLAN[d].clusters[c].exercises[e];
  const g = ex.guide;
  if(!g) return;
  const el = document.getElementById('guideContent');
  el.innerHTML = `
    <div class="drawer-handle"></div>
    <div class="drawer-title">${ex.name}</div>
    ${g.setup?`<div class="g-section"><div class="g-label">Setup</div><div class="g-text">${g.setup}</div></div>`:''}
    ${g.steps?`<div class="g-section"><div class="g-label">Steps</div>${g.steps.map((s,i)=>`<div class="g-step" data-n="${i+1}">${s}</div>`).join('')}</div>`:''}
    ${g.key?`<div class="g-section"><div class="g-label">Key Point</div><div class="g-key">${g.key}</div></div>`:''}
    ${g.warn?`<div class="g-section"><div class="g-label">Watch Out</div><div class="g-warn">${g.warn}</div></div>`:''}`;
  document.getElementById('guideOverlay').classList.add('show');
}

function closeGuide(){
  document.getElementById('guideOverlay').classList.remove('show');
}

document.getElementById('guideOverlay').addEventListener('click',function(e){
  if(e.target === this) closeGuide();
});

// ═══════════════════════════════════════════════
// TIMER
// ═══════════════════════════════════════════════
function setPreset(s){
  timerPreset = s;
  document.querySelectorAll('.timer-p').forEach(el=>{
    el.classList.toggle('sel', parseInt(el.textContent) === s);
  });
  if(timerInterval){
    clearInterval(timerInterval);
    timerSeconds = s;
    updateTimerDisplay();
    startCountdown();
  }
}

function startTimer(){
  timerSeconds = timerPreset;
  updateTimerDisplay();
  document.getElementById('timerOv').classList.add('show');
  if(timerInterval) clearInterval(timerInterval);
  startCountdown();
}

function startCountdown(){
  timerInterval = setInterval(()=>{
    timerSeconds--;
    if(timerSeconds <= 0){
      clearInterval(timerInterval);
      timerInterval = null;
      timerSeconds = 0;
      updateTimerDisplay();
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      setTimeout(closeTimer, 800);
    } else {
      updateTimerDisplay();
    }
  },1000);
}

function updateTimerDisplay(){
  const el = document.getElementById('timerNum');
  const m = Math.floor(timerSeconds/60);
  const s = timerSeconds%60;
  el.textContent = timerSeconds >= 60 ? `${m}:${String(s).padStart(2,'0')}` : timerSeconds;
  el.style.color = timerSeconds <= 10 ? '#f87171' : timerSeconds <= 20 ? '#fb923c' : '#4ade80';
}

function closeTimer(){
  clearInterval(timerInterval);
  timerInterval = null;
  document.getElementById('timerOv').classList.remove('show');
}

document.getElementById('timerOv').addEventListener('click',function(e){
  if(e.target === this) closeTimer();
});

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
render();
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(r => console.log('SW registered'))
      .catch(e => console.log('SW error', e));
  });
}
</script>
</body>
</html>
